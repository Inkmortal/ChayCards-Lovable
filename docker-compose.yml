version: '3.8'

networks:
  chaycards-network:
    driver: bridge

services:
  # ========================================
  # PRODUCT SERVERS
  # ========================================

  postgres:
    image: postgres:15-alpine
    container_name: chaycards-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev}
      # Multiple databases created via init script
    expose:
      - "5432"
    volumes:
      - chaycards_pg_data:/var/lib/postgresql/data
      - ./scripts/init-multi-db.sh:/docker-entrypoint-initdb.d/init-multi-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - chaycards-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    profiles:
      - product
      - all

  api-dev:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: chaycards-api-dev
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:dev@postgres:5432/chaycards_dev}
      PORT: ${PORT:-3101}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production}
      NODE_ENV: ${NODE_ENV:-development}
      CORS_ORIGIN: https://dev.chaycards.com,http://dev.chaycards.com,http://localhost:8080
    expose:
      - "3101"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - chaycards-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    profiles:
      - product
      - all

  # ========================================
  # DEVELOPMENT SERVERS
  # ========================================

  qdrant:
    image: qdrant/qdrant:latest
    container_name: chaycards-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    restart: unless-stopped
    networks:
      - chaycards-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    profiles:
      - dev
      - all

  embedding:
    build:
      context: ./memory-bank/scripts
      dockerfile: Dockerfile.embedding
    container_name: chaycards-embedding
    ports:
      - "8765:8765"
    environment:
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
    restart: unless-stopped
    networks:
      - chaycards-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    profiles:
      - dev
      - all
    # GPU support (requires nvidia-docker: https://github.com/NVIDIA/nvidia-docker)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  notion-pm:
    build:
      context: .
      dockerfile: scripts/Dockerfile.notion-pm
    container_name: chaycards-notion-pm
    environment:
      NOTION_API_KEY: ${NOTION_API_KEY}
      NOTION_PM_PORT: ${NOTION_PM_PORT:-3001}
      NOTION_PM_API_KEY: ${NOTION_PM_API_KEY:-dev-secret-key-change-in-production}
    expose:
      - "3001"
    volumes:
      - ./.notion-pm-cache.json:/app/.notion-pm-cache.json
    restart: unless-stopped
    networks:
      - chaycards-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    profiles:
      - dev
      - all

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: chaycards-cloudflared
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    environment:
      - TUNNEL_ID=6c780a88-8816-46f3-8e89-fd866d5006fd
    volumes:
      - type: bind
        source: ./cloudflared-credentials.json
        target: /etc/cloudflared/credentials.json
        read_only: true
      - type: bind
        source: ./cloudflared-config.yml
        target: /etc/cloudflared/config.yml
        read_only: true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - chaycards-network
    depends_on:
      api-dev:
        condition: service_started
      notion-pm:
        condition: service_started
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    profiles:
      - product
      - all

volumes:
  chaycards_pg_data:
    driver: local
