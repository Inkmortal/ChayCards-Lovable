version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: chaycards-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: chaycards
    ports:
      - "5433:5432"  # Map to port 5433 on host to avoid conflicts
    volumes:
      - chaycards_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  chaycards_pg_data:
    driver: local